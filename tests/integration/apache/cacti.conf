Alias /cacti /var/www/cacti

<Directory /var/www/cacti>
    Require all granted
    AllowOverride None
</Directory>

# Pass the Authorization header to PHP (README, Web server).
SetEnvIf Authorization "(.*)" HTTP_AUTHORIZATION=$1
